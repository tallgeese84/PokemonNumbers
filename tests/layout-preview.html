<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéMath responsive layout review</title>
<style>body{margin:0;background:#e2e7e1;font:14px system-ui;color:#294b3d}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fff}h1{font-size:15px;margin:0 auto 0 0}button{padding:9px 16px;border:1px solid #bccabc;border-radius:9px;background:#f4f7ef;cursor:pointer}button[aria-pressed=true]{background:#286f54;color:white}.stage{padding:20px;overflow:auto}iframe{display:block;border:0;margin:0 auto;background:#f5f6ef;box-shadow:0 6px 30px #294b3d25;border-radius:18px;width:390px;height:844px}</style></head>
<body><header><h1>Responsive layout review · uses this browser’s app data</h1><button data-width="320" data-height="740">Small phone</button><button data-width="390" data-height="844" aria-pressed="true">Phone</button><button data-width="768" data-height="1024">Tablet portrait</button><button data-width="1024" data-height="768">Tablet landscape</button></header><div class="stage"><iframe title="PokéMath device preview" src="../index.html"></iframe></div><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(button=>button.onclick=()=>{frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});</script></body></html>
