name: Feedback repair validation
on:
  push:
    branches: ['feature/feedback-loop-20261016']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot the three public app sources for regression testing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/family-sources/PokemonNumbers
          git archive HEAD | tar -x -C /tmp/family-sources/PokemonNumbers
          git rev-parse HEAD > /tmp/family-sources/PokemonNumbers.source-sha.txt
          for repo in Mochi_MathP4-6 HanaP3Math; do
            git clone --depth 1 https://github.com/tallgeese84/$repo.git /tmp/source-$repo
            mkdir -p /tmp/family-sources/$repo
            git -C /tmp/source-$repo archive HEAD | tar -x -C /tmp/family-sources/$repo
            git -C /tmp/source-$repo rev-parse HEAD > /tmp/family-sources/$repo.source-sha.txt
          done
          tar -czf /tmp/family-app-sources.tar.gz -C /tmp family-sources
      - uses: actions/upload-artifact@v4
        with:
          name: family-app-sources
          path: /tmp/family-app-sources.tar.gz
          retention-days: 2
          if-no-files-found: error
