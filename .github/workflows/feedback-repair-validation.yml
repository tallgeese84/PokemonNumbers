name: Feedback repair validation
on:
  push:
    branches: ['feature/feedback-loop-20261016']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare test dependencies without install scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/family-test-runtime/bin
          cp "$(command -v node)" /tmp/family-test-runtime/bin/node
          for repo in Mochi_MathP4-6 HanaP3Math PokemonNumbers; do
            git clone --depth 1 https://github.com/tallgeese84/$repo.git /tmp/source-$repo
            (cd /tmp/source-$repo && npm ci --ignore-scripts --no-audit --no-fund)
            mkdir -p /tmp/family-test-runtime/$repo
            mv /tmp/source-$repo/node_modules /tmp/family-test-runtime/$repo/node_modules
          done
          tar -czf /tmp/family-test-runtime.tar.gz -C /tmp family-test-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: family-test-runtime
          path: /tmp/family-test-runtime.tar.gz
          retention-days: 2
          if-no-files-found: error
