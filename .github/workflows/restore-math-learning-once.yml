name: Validate direct maths learning

'on':
  push:
    branches: [feature/math-learning-home-20261019]
    paths: [.github/workflows/restore-math-learning-once.yml]

permissions:
  contents: write

concurrency:
  group: jonah-math-learning-home-repair
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/math-learning-home-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped lesson shortcuts
        run: python3 tools/restore-math-learning-once.py
      - name: Validate complete app and actual lesson navigation
        run: |
          git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run test:sittings
      - name: Save only validated source on the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js package.json package-lock.json README.md tests/math-learning-home.test.cjs tests/daily-sittings-flow.cjs tools/restore-math-learning-once.py .github/workflows/restore-math-learning-once.yml
          git commit -m "Restore direct counting, addition and subtraction lessons on home (v97.5)"
          git push origin HEAD:feature/math-learning-home-20261019
