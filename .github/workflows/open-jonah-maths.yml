name: Open Jonah maths on home

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/open-jonah-maths.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply home maths change
        run: python3 tools/open-jonah-maths-once.py

      - name: Validate app
        run: |
          node --check adventure.js
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run test:sittings

      - name: Publish app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Open Jonah maths games from home (v97.4)"
          git push origin HEAD:main
